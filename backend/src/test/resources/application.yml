spring:
  datasource:
    url: jdbc:h2:mem:medical_cloud_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

app:
  security:
    jwt-secret: test-only-secret-key-with-at-least-32-bytes
  storage:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: medical-cloud-test-private

management:
  endpoints:
    web:
      exposure:
        include: health,info
